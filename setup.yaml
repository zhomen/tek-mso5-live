# setup.yaml -- generated by /mhs-setup
#
# Combined setup metadata and driver configuration.
# Top-level keys (device_id, device_type, state, procedures) are consumed
# by the SDK's declarative driver synthesis (the from-yaml model in the
# spec's application API).
#
# The "rig:" section name is a frozen compatibility contract (existing
# user files and launch.py read it) -- do not rename the key. It and
# "devices:" carry interview metadata for the review and re-entry
# path. "backend:" is informational; storage is selected by launch.py's
# --storage flag (per-mode defaults), never by an environment variable.

rig:
  name: tek-mso5-live
  description: "Real Tektronix MSO58 on the network, CH1 on the probe-comp signal; demo of MHS control for a meeting with Madhu"
  backend: inmem
  topology: peripherals
  mode: hardware
  profile: buffer
device_id: "tek-mso5-live"
device_type: "oscilloscope"

devices:
  - id: scope
    type: unknown  # oscilloscope; not in known-devices.yaml
    model: "TEKTRONIX,MSO58,Q100104,CF:91.1CT FV:2.12.5.2206"
    model_source: probed_live
    connection:
      method: ethernet
      address: "10.233.69.122:4000"  # socket server
      address_source: stated_by_user
      probe: {attempted: true, responded: true, idn: "TEKTRONIX,MSO58,Q100104,CF:91.1CT FV:2.12.5.2206", ts: "2026-10-20"}
    notes: "Only the operator uses it. CH1 is on the probe-comp terminal (1 kHz, about 2.5 V). Driver added CH1 FREQUENCY (MEAS1) and PK2PK (MEAS2) measurements with operator approval. Record length is 1.25 M points (operator kept it), so readings refresh about every 2 s. No interlocks (operator choice)."

state:
# ---- Controls ----
  - name: "scope/ch1_scale"
    kind: "control"
    chain:
      - format: "io.mhs/safety_float"
        range: [0.0005, 10.0]
        safe: [0.01, 5.0]
    unit: "V/div"
    on_disconnect: HOLD  # operator chose "keep"
    getter: "scope.ch1_scale"
    setter: "scope.ch1_scale"
    description: "CH1 vertical scale"

  - name: "scope/horizontal_scale"
    kind: "control"
    chain:
      - format: "io.mhs/safety_float"
        range: [2.0e-10, 1000.0]
        safe: [1.0e-6, 0.01]
    unit: "s/div"
    on_disconnect: HOLD  # operator chose "keep"
    getter: "scope.horizontal_scale"
    setter: "scope.horizontal_scale"
    description: "Horizontal (time) scale"

  - name: "scope/run"
    kind: "control"
    chain:
      - format: "io.mhs/safety_int"
        range: [0, 1]
        safe: [0, 1]
        estop_value: 0  # estop matches the ZERO disconnect policy
    unit: ""
    on_disconnect: ZERO  # stops acquiring
    getter: "scope.run"
    setter: "scope.run"
    description: "Acquisition: 0 = stopped, 1 = running"

# ---- Readings ----
  - name: "scope/meas_frequency"
    kind: "sensor"
    chain:
      - format: "io.mhs/float"
    unit: "Hz"
    getter: "scope.meas_frequency"
    description: "Scope's own CH1 frequency measurement (NaN when no result or link down)"

  - name: "scope/meas_vpp"
    kind: "sensor"
    chain:
      - format: "io.mhs/float"
    unit: "V"
    getter: "scope.meas_vpp"
    description: "Scope's own CH1 peak-to-peak measurement (NaN when no result or link down)"

  - name: "scope/ch1_trace"
    kind: "sensor"
    chain:
      - format: "io.mhs/numpy"
        max_size: 16384  # real encoded 1000-point sample measured at 8464 bytes; ~2x headroom
    unit: "V"
    getter: "scope.ch1_trace"
    description: "CH1 record thinned to 1000 evenly spaced points"

  - name: "scope/idn"
    kind: "sensor"
    chain:
      - format: "io.mhs/str"
        max_size: 128
    unit: ""
    getter: "scope.idn"
    description: "Scope identity string from *IDN?"

  - name: "scope/link_error"
    kind: "sensor"
    chain:
      - format: "io.mhs/str"
        max_size: 256
    unit: ""
    getter: "scope.last_error"
    description: "Last network/read error; empty when healthy"

procedures: []
